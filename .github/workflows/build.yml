name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # On main, a version number that has no finished release yet gets
      # published as a GitHub release. The laptops update themselves from
      # those releases. A release without latest.yml (an upload that broke
      # part way) is finished on the next build of main.
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          publish=false
          exists=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if assets=$(gh release view "$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
              exists=true
              echo "$assets" | grep -qx 'latest.yml' || publish=true
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      # Make the release first. electron-builder uploads its files in
      # parallel, and when the release doesn't exist yet each upload tries to
      # create it and all but one fail.
      - name: Create the release
        if: steps.ver.outputs.publish == 'true' && steps.ver.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${{ steps.ver.outputs.tag }}" --notes "Brushbeater POS ${{ steps.ver.outputs.tag }}"

      - name: Build and publish release
        if: steps.ver.outputs.publish == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow adding files to a release made more than 2 hours ago.
          EP_GH_IGNORE_TIME: 'true'

      - name: Build only
        if: steps.ver.outputs.publish != 'true'
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Brushbeater-POS-Setup
          path: dist/*.exe
          if-no-files-found: error
